name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  api:
    name: API (Rust)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: api }
      - run: cargo test --locked
